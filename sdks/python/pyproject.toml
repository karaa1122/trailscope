[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "trailscope"
version = "0.1.0"
description = "Trailscope SDK for Python: non-blocking API request logging for Django, FastAPI/Starlette and Celery"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Trailscope contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
django = ["django>=4.2"]
starlette = ["starlette>=0.37"]
fastapi = ["fastapi>=0.110"]
celery = ["celery>=5.3"]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
  "mypy>=2.4",
  # Newest releases need newer Pythons; 3.10 and 3.11 test against the previous lines.
  "django>=6.1; python_version >= '3.12'",
  "django>=5.2,<6; python_version < '3.12'",
  "starlette>=1.9; python_version >= '3.11'",
  "starlette>=1.0,<1.9; python_version < '3.11'",
  "fastapi>=0.162",
  "httpx>=0.28",
  "celery>=5.6",
]

[project.urls]
Homepage = "https://trailscope.pro"
Source = "https://github.com/karaa1122/trailscope"
Documentation = "https://trailscope.pro/docs/sdk-python/"

[tool.hatch.build.targets.wheel]
packages = ["src/trailscope"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["trailscope"]

[[tool.mypy.overrides]]
module = ["django.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
