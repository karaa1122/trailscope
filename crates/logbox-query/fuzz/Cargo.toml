[package]
name = "logbox-query-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Not part of the main workspace: cargo-fuzz needs a nightly toolchain.
[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
logbox-query = { path = ".." }
logbox-core = { path = "../../logbox-core" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
