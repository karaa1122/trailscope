# __DOMAIN__: the Trailscope website (landing, pricing, docs) and the waitlist endpoint.
# Installed by website/deploy/setup-server.sh as /etc/nginx/sites-available/__DOMAIN__.
# `certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__` then adds the HTTPS listener and the
# http -> https redirect to the server copy (lines marked "managed by Certbot"); after
# that, setup-server.sh leaves the server copy alone.

limit_req_zone $binary_remote_addr zone=trailscope_waitlist:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/__DOMAIN__/current;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    error_page 404 /404.html;

    # one canonical host
    if ($host = www.__DOMAIN__) {
        return 301 $scheme://__DOMAIN__$request_uri;
    }

    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Everything is served from this host. Astro and Starlight use small inline scripts and
    # styles; the docs search (Pagefind) runs WebAssembly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # HTML always revalidates, so a deploy shows up immediately
    location / {
        try_files $uri $uri/ =404;
        expires epoch;
    }

    # Astro's bundles have content hashes in their names
    location /_astro/ {
        expires max;
    }

    location = /og.png {
        expires 7d;
    }

    location = /api/waitlist {
        limit_req zone=trailscope_waitlist burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # dotfiles stay private; .well-known is left open for Let's Encrypt
    location ~ /\.(?!well-known/) {
        deny all;
    }
}
