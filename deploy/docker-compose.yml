# Logbox all-in-one: `docker compose up -d`, then open http://localhost:8080
# Local email testing: `docker compose --profile dev up -d` adds Mailpit at http://localhost:8025
# (in Settings → Notifications → Email use host `mailpit`, port 1025, security none).
name: logbox

services:
  logbox:
    image: ${LOGBOX_IMAGE:-logbox:local}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["all"]
    restart: unless-stopped
    ports:
      - "${LOGBOX_PORT:-8080}:8080"
    environment:
      LOGBOX_SERVER_PUBLIC_URL: ${LOGBOX_PUBLIC_URL:-http://localhost:8080}
      LOGBOX_CLICKHOUSE_URL: http://clickhouse:8123
      LOGBOX_CLICKHOUSE_USER: logbox
      LOGBOX_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-logbox}
      LOGBOX_CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:-logbox_reader}
      LOGBOX_POSTGRES_URL: postgres://logbox:${POSTGRES_PASSWORD:-logbox}@postgres:5432/logbox
      LOGBOX_RETENTION_DAYS: ${LOGBOX_RETENTION_DAYS:-30}
      LOGBOX_RETENTION_BODY_DAYS: ${LOGBOX_RETENTION_BODY_DAYS:-7}
      LOGBOX_LOG_FORMAT: json
      # Encrypts stored secrets and signs mute links. Set a long random value in production.
      LOGBOX_SECRET_KEY: ${LOGBOX_SECRET_KEY:-}
      # Optional: email for alerts. Unset or empty values are ignored, and the field
      # can then be set in Settings → Notifications instead; a value set here locks it.
      LOGBOX_SMTP_HOST: ${LOGBOX_SMTP_HOST:-}
      LOGBOX_SMTP_PORT: ${LOGBOX_SMTP_PORT:-}
      LOGBOX_SMTP_SECURITY: ${LOGBOX_SMTP_SECURITY:-}
      LOGBOX_SMTP_USERNAME: ${LOGBOX_SMTP_USERNAME:-}
      LOGBOX_SMTP_PASSWORD: ${LOGBOX_SMTP_PASSWORD:-}
      LOGBOX_SMTP_FROM: ${LOGBOX_SMTP_FROM:-}
      LOGBOX_SMTP_FROM_NAME: ${LOGBOX_SMTP_FROM_NAME:-}
      # Optional: single sign-on with an OpenID Connect provider (docs/configuration.md#oidc).
      LOGBOX_OIDC_ISSUER: ${LOGBOX_OIDC_ISSUER:-}
      LOGBOX_OIDC_CLIENT_ID: ${LOGBOX_OIDC_CLIENT_ID:-}
      LOGBOX_OIDC_CLIENT_SECRET: ${LOGBOX_OIDC_CLIENT_SECRET:-}
      LOGBOX_OIDC_DISPLAY_NAME: ${LOGBOX_OIDC_DISPLAY_NAME:-}
      LOGBOX_OIDC_AUTO_CREATE_DOMAINS: ${LOGBOX_OIDC_AUTO_CREATE_DOMAINS:-}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/logbox", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: logbox
      CLICKHOUSE_USER: logbox
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-logbox}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/users.d/profiles.xml:/etc/clickhouse-server/users.d/profiles.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logbox}
      POSTGRES_DB: logbox
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbox -d logbox"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  clickhouse-data:
  postgres-data:
