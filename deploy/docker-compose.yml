# Trailscope all-in-one: `docker compose up -d`, then open http://localhost:8080
# Local email testing: `docker compose --profile dev up -d` adds Mailpit at http://localhost:8025
# (in Settings → Notifications → Email use host `mailpit`, port 1025, security none).
name: trailscope

services:
  trailscope:
    image: ${TRAILSCOPE_IMAGE:-trailscope:local}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["all"]
    restart: unless-stopped
    ports:
      - "${TRAILSCOPE_PORT:-8080}:8080"
    environment:
      TRAILSCOPE_SERVER_PUBLIC_URL: ${TRAILSCOPE_PUBLIC_URL:-http://localhost:8080}
      TRAILSCOPE_CLICKHOUSE_URL: http://clickhouse:8123
      TRAILSCOPE_CLICKHOUSE_USER: trailscope
      TRAILSCOPE_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-trailscope}
      TRAILSCOPE_CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:-trailscope_reader}
      TRAILSCOPE_POSTGRES_URL: postgres://trailscope:${POSTGRES_PASSWORD:-trailscope}@postgres:5432/trailscope
      TRAILSCOPE_RETENTION_DAYS: ${TRAILSCOPE_RETENTION_DAYS:-30}
      TRAILSCOPE_RETENTION_BODY_DAYS: ${TRAILSCOPE_RETENTION_BODY_DAYS:-7}
      TRAILSCOPE_LOG_FORMAT: json
      # Encrypts stored secrets and signs mute links. Set a long random value in production.
      TRAILSCOPE_SECRET_KEY: ${TRAILSCOPE_SECRET_KEY:-}
      # Optional: email for alerts. Unset or empty values are ignored, and the field
      # can then be set in Settings → Notifications instead; a value set here locks it.
      TRAILSCOPE_SMTP_HOST: ${TRAILSCOPE_SMTP_HOST:-}
      TRAILSCOPE_SMTP_PORT: ${TRAILSCOPE_SMTP_PORT:-}
      TRAILSCOPE_SMTP_SECURITY: ${TRAILSCOPE_SMTP_SECURITY:-}
      TRAILSCOPE_SMTP_USERNAME: ${TRAILSCOPE_SMTP_USERNAME:-}
      TRAILSCOPE_SMTP_PASSWORD: ${TRAILSCOPE_SMTP_PASSWORD:-}
      TRAILSCOPE_SMTP_FROM: ${TRAILSCOPE_SMTP_FROM:-}
      TRAILSCOPE_SMTP_FROM_NAME: ${TRAILSCOPE_SMTP_FROM_NAME:-}
      # Optional: single sign-on with an OpenID Connect provider (docs/configuration.md#oidc).
      TRAILSCOPE_OIDC_ISSUER: ${TRAILSCOPE_OIDC_ISSUER:-}
      TRAILSCOPE_OIDC_CLIENT_ID: ${TRAILSCOPE_OIDC_CLIENT_ID:-}
      TRAILSCOPE_OIDC_CLIENT_SECRET: ${TRAILSCOPE_OIDC_CLIENT_SECRET:-}
      TRAILSCOPE_OIDC_DISPLAY_NAME: ${TRAILSCOPE_OIDC_DISPLAY_NAME:-}
      TRAILSCOPE_OIDC_AUTO_CREATE_DOMAINS: ${TRAILSCOPE_OIDC_AUTO_CREATE_DOMAINS:-}
      # Optional: enforce plan limits per organization (docs/configuration.md#cloud).
      TRAILSCOPE_CLOUD_ENABLED: ${TRAILSCOPE_CLOUD_ENABLED:-}
      # Optional: turns on the management API (docs/configuration.md#management-api).
      TRAILSCOPE_ADMIN_TOKEN: ${TRAILSCOPE_ADMIN_TOKEN:-}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/trailscope", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: trailscope
      CLICKHOUSE_USER: trailscope
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-trailscope}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/users.d/profiles.xml:/etc/clickhouse-server/users.d/profiles.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trailscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trailscope}
      POSTGRES_DB: trailscope
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailscope -d trailscope"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  clickhouse-data:
  postgres-data:
