name: Release

# Push a tag like v0.2.0 to publish:
# - the multi-arch server image to GHCR (ghcr.io/<owner>/trailscope:0.2.0, :0.2, :latest)
# - every Node SDK whose version isn't on npm yet (versions come from changesets)
# - the Python SDK, unless that version is already on PyPI
# - the Java SDK to Maven Central, unless that version is already there
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    name: Server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/trailscope
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: Node SDKs to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Builds the SDKs and publishes the versions that aren't on npm yet.
      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  pypi:
    name: Python SDK to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
        working-directory: sdks/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          skip-existing: true

  maven:
    name: Java SDK to Maven Central
    runs-on: ubuntu-latest
    # Needs MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_TOKEN (a central.sonatype.com user token),
    # MAVEN_GPG_PRIVATE_KEY and MAVEN_GPG_PASSPHRASE, and the verified namespace dev.trailscope.
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - id: check
        run: |
          v=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if curl -sfI "https://repo1.maven.org/maven2/dev/trailscope/trailscope-java/$v/trailscope-java-$v.pom"; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: mvn -B -P release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
