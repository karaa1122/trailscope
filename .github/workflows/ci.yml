name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        env:
          CLICKHOUSE_USER: logbox
          CLICKHOUSE_PASSWORD: logbox
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
          --ulimit nofile=262144:262144
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: logbox
          POSTGRES_PASSWORD: logbox
          POSTGRES_DB: logbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logbox" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LOGBOX_TEST_CLICKHOUSE_URL: http://localhost:8123
      LOGBOX_TEST_CLICKHOUSE_USER: logbox
      LOGBOX_TEST_CLICKHOUSE_PASSWORD: logbox
      LOGBOX_TEST_POSTGRES_URL: postgres://logbox:logbox@localhost:5432/logbox
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @logbox/web lint
      - run: pnpm --filter @logbox/web typecheck
      - run: pnpm --filter @logbox/web test
      - run: pnpm --filter @logbox/web build

  node-sdk:
    name: Node SDKs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./sdks/node/**" build
      - run: pnpm --filter "./sdks/node/**" lint
      - run: pnpm --filter "./sdks/node/**" typecheck
      - run: pnpm --filter "./sdks/node/**" test

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
