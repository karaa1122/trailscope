name: Feature request
description: An idea for Trailscope or one of the SDKs
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Screenshots, sketches or examples from other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
